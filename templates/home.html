<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRIB Cropper</title>
    <style>
        :root { --bg:#0b1220; --panel:#121c30; --line:#26344f; --text:#e6edf7; --muted:#8fa0ba; --accent:#38bdf8; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans", system-ui, sans-serif; }
        main { width:min(560px,100%); }
        h1 { font-size:28px; margin:0 0 8px; font-weight:600; }
        p { color:var(--muted); margin:0 0 28px; line-height:1.5; }
        .model { display:block; padding:20px 22px; margin-bottom:12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); text-decoration:none; }
        a.model:hover, a.model:focus-visible { border-color:var(--accent); outline:none; }
        .model strong { display:block; font-size:18px; margin-bottom:4px; }
        .model span { color:var(--muted); font-size:14px; }
        .model.soon { opacity:.55; }
    </style>
</head>
<body>
<main>
    <h1>GRIB Cropper</h1>
    <p>Découpez les prévisions GRIB d'un modèle global sur votre zone, avec les seuls paramètres et échéances dont vous avez besoin.</p>
    <a class="model" href="/cep/">
        <strong>CEP / IFS</strong>
        <span>Centre européen, 0,25° — surface et niveaux en altitude</span>
    </a>
    <div class="model soon">
        <strong>Autres modèles</strong>
        <span>Pas encore disponible</span>
    </div>
</main>
</body>
</html>
