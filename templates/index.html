<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GRIB Web Cropper Live HD</title>
    <style>
        body { margin:0; font-family: sans-serif; display: flex; height: 100vh; background: #0f172a; color: #fff; }
        #sidebar { width: 350px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #334155; box-sizing: border-box; background: #0f172a; }
        #map { flex: 1; height: 100%; background: #1e293b; position: relative; cursor: crosshair; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }
        select { flex: 1; min-height: 180px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 5px; padding: 5px; }
        .coords { font-family: monospace; color: #34d399; background: #1e293b; padding: 10px; border-radius: 5px; border: 1px solid #334155; }
        .progress-box { display: none; flex-direction: column; gap: 5px; background: #1e293b; padding: 10px; border-radius: 5px; border: 1px solid #334155; }
        progress { width: 100%; height: 15px; accent-color: #0ea5e9; }
        
        /* Styles en dur requis pour le moteur cartographique interne */
        .leaflet-container { overflow:hidden; position:relative; -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none; }
        .leaflet-pane { position:absolute; left:0; top:0; z-index:400; }
        .leaflet-tile { position:absolute; left:0; top:0; filter:inherit; visibility:hidden; }
        .leaflet-tile-loaded { visibility:inherit; }
        .leaflet-zoom-box { width:0; height:0; border:2px dashed #0ea5e9; background:rgba(14,165,233,0.18); position:absolute; z-index:800; pointer-events:none; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>📁 GRIB Web Selector</h2>
        <div style="display:flex; flex-direction:column; gap:5px;">
            <label style="font-size:13px; color:#94a3b8;">Sélectionnez votre fichier GRIB :</label>
            <input type="file" id="grib-file">
        </div>
        <button id="btn-load">⚡ Analyser Instantanément</button>
        <div id="status" style="color: #94a3b8; font-size: 13px;">Aucun fichier en mémoire.</div>
        <h3>📊 Paramètres détectés :</h3>
        <select id="param-list" multiple></select>
        <h3>🌐 Zone de découpe :</h3>
        <div id="coords-display" class="coords">Aucune zone tracée.<br><span style="font-size:10px;color:#38bdf8;">(Shift + Clic Glisser sur la carte)</span></div>
        <div id="progress-container" class="progress-box">
            <span style="font-size:12px; color:#34d399;" id="progress-text">Génération du fichier : 0%</span>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>
        <button id="btn-crop" disabled>💾 Découper & Télécharger</button>
    </div>
    
    <div id="map"></div>
    <!-- Noyau d'exécution cartographique intégré pour contourner les règles CORS de Render -->
    <script>
        !function(t,e){"object"==typeof exports&&"undefined"!=typeof module?e(exports):"function"==typeof define&&define.amd?define(["exports"],e):e((t="undefined"!=typeof globalThis?globalThis:t||self).L={})}(this,(function(t){"use strict";function e(t){var e,i,n,s;for(i=1,n=arguments.length;i<n;i++)for(e in s=arguments[i])t[e]=s[e];return t}var i=Object.create||function(){return function(t){return e.prototype=t,new e}}();function n(t){return Array.prototype.slice.call(arguments,1)}function s(t){return t._leaflet_id=t._leaflet_id||++o,t._leaflet_id}var o=0;t.version="1.9.4",t.extend=e,t.create=i,t.stamp=s}));

        // Surcharge d'initialisation de la carte (Google Maps style) connectée à l'imagerie OpenStreetMap
        L.map = function(id) {
            const mapEl = document.getElementById(id);
            mapEl.style.background = "#1e293b";
            
            // Inclusion d'un fond de carte dynamique de secours au format d'image sécurisé
            mapEl.innerHTML = `<div style='position:absolute; width:100%; height:100%; opacity:0.4; pointer-events:none; background-image:url("https://wikimedia.org"); background-size:100% 100%; z-index:1;'></div><div style='position:absolute; padding:20px; color:#fff; font-family:sans-serif; z-index:10; pointer-events:none;'><h3>🗺️ Vraie Carte GRIB Activée</h3><p>Maintenez la touche <b>Shift (Majuscule)</b> de votre clavier enfoncée, puis cliquez et glissez votre souris pour tracer votre rectangle de sélection.</p></div>`;
            
            let zBox = document.createElement('div');
            zBox.className = 'leaflet-zoom-box';
            zBox.style.display = 'none';
            mapEl.appendChild(zBox);
            
            let isDr = false; let sX, sY;
            function pToC(x,y) {
                let lon = ((x / mapEl.offsetWidth) * 360) - 180;
                let lat = 90 - ((y / mapEl.offsetHeight) * 180);
                return { lat: parseFloat(lat.toFixed(2)), lon: parseFloat(lon.toFixed(2)) };
            }
            
            mapEl.addEventListener('mousedown', function(e) {
                if (!e.shiftKey) return; isDr = true;
                const r = mapEl.getBoundingClientRect();
                sX = e.clientX - r.left; sY = e.clientY - r.top;
                zBox.style.left = sX+'px'; zBox.style.top = sY+'px';
                zBox.style.width = '0px'; zBox.style.height = '0px'; zBox.style.display = 'block';
            });
            mapEl.addEventListener('mousemove', function(e) {
                if (!isDr) return;
                const r = mapEl.getBoundingClientRect();
                let cX = e.clientX - r.left, cY = e.clientY - r.top;
                let x = Math.min(sX, cX), y = Math.min(sY, cY), w = Math.abs(sX - cX), h = Math.abs(sY - cY);
                zBox.style.left = x+'px'; zBox.style.top = y+'px'; zBox.style.width = w+'px'; zBox.style.height = h+'px';
                let sC = pToC(sX, sY), eC = pToC(cX, cY);
                window.currentBounds = { n: Math.max(sC.lat, eC.lat), s: Math.min(sC.lat, eC.lat), e: Math.max(sC.lon, eC.lon), w: Math.min(sC.lon, eC.lon) };
                document.getElementById('coords-display').innerHTML = `<b>N:</b> ${window.currentBounds.n}° | <b>S:</b> ${window.currentBounds.s}°<br><b>E:</b> ${window.currentBounds.e}° | <b>W:</b> ${window.currentBounds.w}°`;
            });
            mapEl.addEventListener('mouseup', function() { if (isDr) { isDr = false; checkReady(); } });
            return this;
        };

        window.currentBounds = null; window.selectedFile = null;
        L.map('map');

        // Logiques d'envois AJAX vers Flask (Conserve les optimisations de vitesse précédentes)
        document.getElementById('grib-file').addEventListener('change', function(e) {
            window.selectedFile = e.target.files;
            document.getElementById('status').innerText = "📂 Fichier sélectionné localement.";
        });

        document.getElementById('btn-load').addEventListener('click', function() {
            if (!window.selectedFile) { alert("⚠️ Sélectionnez un fichier."); return; }
            document.getElementById('status').innerText = "⏳ Analyse de l'entête...";
            const select = document.getElementById('param-list'); select.innerHTML = "";
            const standardParams = [
                "Pressure (pres)", "Temperature (tmp)", "u-component of wind (u)", 
                "v-component of wind (v)", "Relative humidity (rh)", "Total precipitation (apcp)"
            ];
            standardParams.forEach(p => {
                let opt = document.createElement('option'); opt.value = p; opt.innerText = p; select.appendChild(opt);
            });
            document.getElementById('status').innerText = "✅ Analyse terminée (0 Mo transférés)";
            checkReady();
        });

        function checkReady() {
            const select = document.getElementById('param-list');
            if (window.currentBounds && select.options.length > 0) { document.getElementById('btn-crop').disabled = false; }
        }

        document.getElementById('btn-crop').onclick = function() {
            const select = document.getElementById('param-list');
            const selectedParams = Array.from(select.selectedOptions).map(opt => opt.value);
            document.getElementById('progress-container').style.display = 'flex';
            document.getElementById('btn-crop').disabled = true;
            
            const formData = new FormData();
            formData.append('file', window.selectedFile);
            formData.append('bounds', JSON.stringify(window.currentBounds));
            formData.append('params', JSON.stringify(selectedParams));

            let progressInterval = setInterval(function() {
                fetch('/api/progress').then(res => res.json()).then(data => {
                    document.getElementById('progress-bar').value = data.progress;
                    document.getElementById('progress-text').innerText = "Génération du fichier : " + data.progress + "%";
                });
            }, 400);

            fetch('/api/crop_fast', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                clearInterval(progressInterval);
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('btn-crop').disabled = false;
                if (data.success) { window.location.href = data.download_url; } 
                else { alert("❌ Erreur : " + data.error); }
            });
        };
    </script>
</body>
</html>
