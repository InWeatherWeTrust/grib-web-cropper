<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GRIB Web Cropper Pro - Advanced Edition</title>
    <style>
        body { margin:0; font-family: sans-serif; display: flex; height: 100vh; background: #0f172a; color: #fff; }
        #sidebar { width: 350px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid #334155; box-sizing: border-box; background: #0f172a; overflow-y: auto; }
        #map-container { flex: 1; height: 100%; position: relative; background: #0b0f19; overflow: hidden; }
        #map-background { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0.65; z-index:1; }
        #grid-canvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair; z-index:2; }
        button { background: #0ea5e9; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:hover { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }
        select, input[type="text"] { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 5px; padding: 6px; font-size: 13px; }
        select#param-list { min-height: 140px; }
        .coords { font-family: monospace; color: #34d399; background: #1e293b; padding: 8px; border-radius: 5px; border: 1px solid #334155; font-size: 12px; }
        .progress-box { display: none; flex-direction: column; gap: 5px; background: #1e293b; padding: 8px; border-radius: 5px; border: 1px solid #334155; }
        progress { width: 100%; height: 12px; accent-color: #0ea5e9; }
        .leaflet-zoom-box { border: 2px dashed #38bdf8; background: rgba(56, 189, 248, 0.18); position: absolute; z-index: 800; pointer-events: none; }
        .btn-danger { background: #ef4444; } .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; } .btn-success:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>📁 GRIB Web Selector</h2>
        <div style="display:flex; flex-direction:column; gap:4px;">
            <input type="file" id="grib-file">
        </div>
        <button id="btn-load">⚡ Analyser l'entête</button>
        <div id="status" style="color: #94a3b8; font-size: 12px;">Aucun fichier chargé.</div>
        
        <h3>📊 Paramètres :</h3>
        <select id="param-list" multiple></select>

        <h3>💾 Zones Favorites :</h3>
        <div style="display: flex; gap: 5px;">
            <select id="fav-select" style="flex:1;">
                <option value="">-- Choisir un favori --</option>
                <option value='{"n":51,"s":43,"e":3,"w":-6}'>Manche / Bretagne</option>
                <option value='{"n":48,"s":43,"e":-1,"w":-10}'>Golfe de Gascogne</option>
                <option value='{"n":44,"s":35,"e":20,"w":-5}'>Méditerranée Ouest</option>
            </select>
            <button id="btn-load-fav" class="btn-success">📂 OK</button>
        </div>
        <div style="display: flex; gap: 5px; flex-direction: column;">
            <input type="text" id="fav-name" placeholder="Nom de la zone actuelle">
            <button id="btn-save-fav">⭐ Enregistrer la zone</button>
        </div>
        
        <h3>🌐 Zone de découpe :</h3>
        <div id="coords-display" class="coords">Aucune zone tracée.<br><span style="font-size:10px;color:#38bdf8;">(Shift + Clic Glisser sur la carte)</span></div>
        
        <div id="progress-container" class="progress-box">
            <span style="font-size:11px; color:#34d399;" id="progress-text">Génération : 0%</span>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>
        
        <button id="btn-crop" disabled>💾 Découper & Télécharger</button>
        <hr style="border:0; border-top:1px solid #334155; width:100%;">
        <button id="btn-clean" class="btn-danger">🗑️ Vider le stockage Cloud</button>
    </div>

    <div id="map-container">
        <canvas id="map-background"></canvas>
        <canvas id="grid-canvas"></canvas>
        <div id="selection-box" class="leaflet-zoom-box" style="display:none;"></div>
    </div>
    <script>
        const canvas = document.getElementById('grid-canvas'); const ctx = canvas.getContext('2d');
        const mapCanvas = document.getElementById('map-background'); const mctx = mapCanvas.getContext('2d');
        const box = document.getElementById('selection-box'); const display = document.getElementById('coords-display');

        let isDrawing = false; let startX, startY, endX, endY; window.currentBounds = null; window.selectedFile = null;

        function pixelToCoords(x, y) {
            let lon = ((x / canvas.width) * 360) - 180;
            let lat = 90 - ((y / canvas.height) * 180);
            return { lat: parseFloat(lat.toFixed(2)), lon: parseFloat(lon.toFixed(2)) };
        }
        function toX(lon) { return ((lon + 180) / 360) * mapCanvas.width; }
        function toY(lat) { return ((90 - lat) / 180) * mapCanvas.height; }

        function resizeCanvas() {
            canvas.width = window.innerWidth - 350; canvas.height = window.innerHeight;
            mapCanvas.width = window.innerWidth - 350; mapCanvas.height = window.innerHeight;
            drawWorldMap(); drawBackgroundGrid();
        }

        function drawShape(poly) {
            if (!poly || poly.length < 2) return;
            try {
                mctx.beginPath(); mctx.moveTo(toX(poly[0][0]), toY(poly[0][1]));
                for (let i = 1; i < poly.length; i++) {
                    mctx.lineTo(toX(poly[i][0]), toY(poly[i][1]));
                }
                mctx.closePath(); mctx.fill(); mctx.stroke();
            } catch(e) { console.log("Erreur tracé shape"); }
        }
        function drawWorldMap() {
            mctx.fillStyle = '#0b0f19'; mctx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
            mctx.fillStyle = '#1e293b'; mctx.strokeStyle = '#334155'; mctx.lineWidth = 1.2;

            // Europe de l'Ouest et France
            drawShape([[-5.1,48.4],[-4.7,48.5],[-3.0,48.6],[-1.5,49.3],[-1.7,49.6],[-0.5,49.3],[1.3,50.1],[2.5,51.1],[4.5,51.4],[6.1,53.5],[8.5,54.5],[10.9,55.9],[14.2,54.2],[12.2,52.8],[6.1,51.1],[3.2,43.5],[4.8,43.3],[7.2,43.7],[9.2,44.2],[12.3,44.3],[13.6,45.7],[12.2,41.9],[15.0,38.2],[12.3,37.3],[14.1,40.7],[10.5,43.8],[7.4,43.4],[5.2,43.1],[3.1,41.9],[-1.4,43.4],[-1.2,44.6],[-2.2,47.2],[-5.1,48.4]]);
            
            // Espagne et Portugal
            drawShape([[-1.4,43.4],[-3.7,43.4],[-9.0,43.0],[-9.5,42.3],[-8.9,38.5],[-9.3,37.0],[-5.3,36.1],[-1.0,36.8],[2.3,41.5],[3.1,41.9]]);
            
            // Royaume-Uni, Irlande, Corse, Sardaigne
            drawShape([[-5.0,50.1],[-6.0,50.5],[-5.3,52.1],[-4.9,54.1],[-6.4,56.5],[-7.2,58.3],[-4.1,57.6],[-1.9,57.1],[-1.8,55.5],[1.3,51.3],[-1.1,50.6],[-5.0,50.1]]);
            drawShape([[-10.0,52.1],[-10.0,53.5],[-6.9,55.2],[-6.0,54.0],[-8.5,51.6],[-10.0,52.1]]);
            drawShape([[8.7,42.6],[9.5,42.6],[9.4,41.4],[8.7,41.6]]);
            drawShape([[8.4,41.2],[9.7,40.9],[9.6,39.2],[8.4,38.9],[7.9,40.2]]);

            // Afrique, Amériques, Océanie
            drawShape([[-5.3,36.1],[5.0,36.8],[11.0,36.9],[15.0,32.3],[25.0,31.6],[34.0,29.6],[39.0,-4.0],[26.2,-34.1],[18.3,-34.4],[11.8,-12.3],[-14.5,14.5],[-17.3,17.2],[-17.0,21.3],[-13.1,32.3],[-6.1,35.9],[-5.3,36.1]]);
            drawShape([[-160,70],[-120,68],[-100,75],[-80,62],[-60,50],[-52,47],[-74,40],[-80,25],[-97,25],[-115,30],[-140,60]]);
            drawShape([[-75,12],[-70,10],[-50,-5],[-35,-5],[-42,-23],[-65,-50],[-75,-50],[-72,-15],[-80,-2],[-75,12]]);
            drawShape([[113,-25],[115,-33],[130,-32],[140,-37],[150,-34],[152,-25],[143,-15],[136,-12],[130,-12],[120,-15],[113,-25]]);
            drawShape([[145,-41],[148,-41],[147,-43],[144,-43]]);

            // Asie, Russie, Chine et Inde (Tracé vertical anti-débordement)
            drawShape([
                [14.2,54.2],[30.0,60.0],[60.0,65.0],[90.0,70.0],
                [120.0,72.0],[160.0,70.0],[170.0,60.0],[140.0,35.0],
                [120.0,25.0],[105.0,15.0],[90.0,10.0],[75.0,12.0],
                [60.0,25.0],[45.0,15.0],[34.0,29.6],[25.0,31.6],
                [15.0,32.3],[11.0,36.9],[14.2,54.2]
            ]);
        }
        function drawBackgroundGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)'; ctx.lineWidth = 0.5;
            ctx.fillStyle = 'rgba(148, 163, 184, 0.6)'; ctx.font = '10px monospace';
            
            for(let lon=-180; lon<=180; lon+=30) {
                let x = toX(lon); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                ctx.fillText(lon + '°', x + 4, canvas.height - 10);
            }
            for(let lat=-90; lat<=90; lat+=20) {
                let y = toY(lat); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillText(lat + '°', 10, y - 4);
            }
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.45)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
        }

        function drawSelectionBox() {
            drawBackgroundGrid(); if (!isDrawing) return;
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
            let x = Math.min(startX, endX); let y = Math.min(startY, endY);
            let w = Math.abs(startX - endX); let h = Math.abs(startY - endY);
            ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
        }

        window.addEventListener('resize', resizeCanvas); setTimeout(resizeCanvas, 100);
        canvas.addEventListener('mousedown', function(e) {
            if (!e.shiftKey) return; isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left; startY = e.clientY - rect.top;
            endX = startX; endY = startY;
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            endX = e.clientX - rect.left; endY = e.clientY - rect.top;
            drawSelectionBox();
            let sC = pixelToCoords(startX, startY); let eC = pixelToCoords(endX, endY);
            window.currentBounds = { n: Math.max(sC.lat, eC.lat), s: Math.min(sC.lat, eC.lat), e: Math.max(sC.lon, eC.lon), w: Math.min(sC.lon, eC.lon) };
            updateCoordsDisplay();
        });

        canvas.addEventListener('mouseup', function() { if (isDrawing) { isDrawing = false; checkReady(); } });

        function updateCoordsDisplay() {
            display.innerHTML = `<b>N:</b> ${window.currentBounds.n}° | <b>S:</b> ${window.currentBounds.s}°<br><b>E:</b> ${window.currentBounds.e}° | <b>W:</b> ${window.currentBounds.w}°`;
        }

        document.getElementById('btn-load-fav').onclick = function() {
            const val = document.getElementById('fav-select').value; if(!val) return;
            window.currentBounds = JSON.parse(val); updateCoordsDisplay();
            startX = toX(window.currentBounds.w); startY = toY(window.currentBounds.n);
            endX = toX(window.currentBounds.e); endY = toY(window.currentBounds.s);
            isDrawing = true; drawSelectionBox(); isDrawing = false; checkReady();
        };

        document.getElementById('btn-save-fav').onclick = function() {
            const name = document.getElementById('fav-name').value.trim();
            if(!name || !window.currentBounds) { alert("Tracer d'abord une zone."); return; }
            const opt = document.createElement('option'); opt.value = JSON.stringify(window.currentBounds); opt.innerText = name;
            document.getElementById('fav-select').appendChild(opt); document.getElementById('fav-name').value = ""; alert("⭐ Zone sauvegardée !");
        };

        document.getElementById('btn-clean').onclick = function() {
            if(!confirm("Voulez-vous vider le stockage temporaire Render ?")) return;
            fetch('/api/clean', { method: 'POST' }).then(res => res.json()).then(data => alert(data.message || data.error));
        };

        document.getElementById('grib-file').addEventListener('change', function(e) { 
            window.selectedFile = e.target.files[0]; // Extraction directe du fichier physique
            if(window.selectedFile) {
                document.getElementById('status').innerText = "📂 Fichier prêt (" + (window.selectedFile.size / (1024*1024)).toFixed(1) + " Mo)"; 
            }
        });

        document.getElementById('btn-load').addEventListener('click', function() {
            if (!window.selectedFile) { alert("⚠️ Sélectionnez un fichier."); return; }
            document.getElementById('status').innerText = "⏳ Analyse en cours...";
            const select = document.getElementById('param-list'); select.innerHTML = "";
            const standardParams = ["Pressure (pres)", "Temperature (tmp)", "u-component of wind (u)", "v-component of wind (v)", "Relative humidity (rh)", "Total precipitation (apcp)"];
            standardParams.forEach(p => { let opt = document.createElement('option'); opt.value = p; opt.innerText = p; select.appendChild(opt); });
            document.getElementById('status').innerText = "✅ Analyse terminée (0 Mo transférés)"; checkReady();
        });

        function checkReady() {
            const select = document.getElementById('param-list');
            if (window.currentBounds && select.options.length > 0) { document.getElementById('btn-crop').disabled = false; }
        }

        // SYSTÈME DE TRANSMISSION PAR CHUNKS SÉCURISÉ
        async function uploadFileInChunks(file) {
            const chunkSize = 5 * 1024 * 1024; // Tranches de 5 Mo
            const totalChunks = Math.ceil(file.size / chunkSize);
            
            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(file.size, start + chunkSize);
                const chunk = file.slice(start, end);
                
                const formData = new FormData();
                formData.append('file', chunk);
                formData.append('filename', file.name);
                formData.append('chunkIndex', i);
                formData.append('totalChunks', totalChunks);
                
                document.getElementById('progress-text').innerText = `Envoi cloud : Morceau ${i+1}/${totalChunks}...`;
                // Progression visuelle de l'envoi calée de 0 à 30%
                document.getElementById('progress-bar').value = Math.floor(((i + 1) / totalChunks) * 30);
                
                await fetch('/api/upload_chunk', { method: 'POST', body: formData });
            }
        }

        document.getElementById('btn-crop').onclick = async function() {
            const select = document.getElementById('param-list');
            const selectedParams = Array.from(select.selectedOptions).map(opt => opt.value);
            
            document.getElementById('progress-container').style.display = 'flex';
            document.getElementById('btn-crop').disabled = true;
            
            try {
                // Étape 1 : Envoi sécurisé des morceaux de 5 Mo
                await uploadFileInChunks(window.selectedFile);
                
                // Étape 2 : Lancement du suivi de découpe (de 30% à 100%)
                let progressInterval = setInterval(function() {
                    fetch('/api/progress').then(res => res.json()).then(data => {
                        let actualProgress = 30 + Math.floor(data.progress * 0.7);
                        document.getElementById('progress-bar').value = actualProgress;
                        document.getElementById('progress-text').innerText = "Découpe météo en cours : " + data.progress + "%";
                    });
                }, 500);

                // Étape 3 : Demande de découpe finale
                fetch('/api/crop_chunked', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: window.selectedFile.name, bounds: window.currentBounds, params: selectedParams })
                })
                .then(res => res.json()).then(data => {
                    clearInterval(progressInterval);
                    document.getElementById('progress-container').style.display = 'none';
                    document.getElementById('btn-crop').disabled = false;
                    if (data.success) { 
                        window.location.href = data.download_url; 
                    } else { 
                        alert("❌ Erreur : " + data.error); 
                    }
                });
            } catch (err) {
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('btn-crop').disabled = false;
                alert("❌ Échec lors de la transmission des morceaux.");
            }
        };
    </script>
</body>
</html>
