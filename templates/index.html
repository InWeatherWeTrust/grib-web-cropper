<script>
    // Configuration d'origine de la carte
    const map = L.map('map').setView([45.0, -2.0], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentBounds = null;
    let currentLevType = 'sfc';
    
    // Rectangle de sélection Leaflet historique
    const selectArea = L.rectangle([[43.0, -8.0], [49.0, 4.0]], {
        color: "#0d6efd", weight: 2, fillOpacity: 0.1, editable: true
    }).addTo(map);

    function updateBounds() {
        const b = selectArea.getBounds();
        currentBounds = { n: b.getNorth().toFixed(2), s: b.getSouth().toFixed(2), w: b.getWest().toFixed(2), e: b.getEast().toFixed(2) };
        document.getElementById('bounds-display').innerText = `N: ${currentBounds.n} | S: ${currentBounds.s} | W: ${currentBounds.w} | E: ${currentBounds.e}`;
    }
    map.on('moveend', updateBounds);
    updateBounds();

    // Dictionnaire de vos zones favorites
    const favorites = {
        manche: { n: 51.50, s: 47.50, w: -7.00, e: 2.50 },
        gascogne: { n: 48.00, s: 43.00, w: -10.00, e: -1.00 },
        med: { n: 44.50, s: 37.00, w: -2.00, e: 9.00 }
    };

    function loadFavoriteZone() {
        const code = document.getElementById('select-favorite').value;
        if (code && favorites[code]) {
            const z = favorites[code];
            selectArea.setBounds([[z.s, z.w], [z.n, z.e]]);
            map.fitBounds([[z.s, z.w], [z.n, z.e]]);
            updateBounds();
        }
    }

    function updateLevType(mode) {
        currentLevType = mode;
        document.getElementById('params-box').innerHTML = "En attente du scan...";
        document.getElementById('levels-box').innerHTML = "En attente du scan...";
        document.getElementById('btn-crop').disabled = true;
    }

    // VOTRE FONCTION SCAN REPRISE AVEC LA TRANSMISSION DE LA CASE A COCHER
    async function scanCatalog() {
        const checkedSteps = Array.from(document.querySelectorAll('.chk-step:checked')).map(el => el.value);
        const useFallback = document.getElementById('useFallbackRun').checked; // LECTURE DE LA CASE

        if (checkedSteps.length === 0) { alert("Veuillez cocher au moins une échéance."); return; }
        
        const btn = document.getElementById('btn-scan');
        btn.disabled = true; btn.innerText = "Scan en cours...";

        try {
            const r = await fetch('/api/scan_ecmwf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steps: checkedSteps, levtype: currentLevType, use_fallback: useFallback }) // ENVOI FLUX DE SECOURS
            });
            const res = await r.json();
            if (res.error) { alert(res.error); return; }

            const pBox = document.getElementById('params-box'); pBox.innerHTML = "";
            res.params.forEach(p => {
                pBox.innerHTML += `<div class="form-check"><input class="form-check-input chk-p" type="checkbox" value="${p}" id="${p}" checked><label class="form-check-label" for="${p}">${p}</label></div>`;
            });

            const lBox = document.getElementById('levels-box'); lBox.innerHTML = "";
            if (currentLevType === 'sfc') {
                lBox.innerHTML = `<span class="text-success">Données de surface (0m)</span><input type="hidden" class="chk-l" value="0">`;
            } else {
                res.levels.forEach(l => {
                    lBox.innerHTML += `<div class="form-check"><input class="form-check-input chk-l" type="checkbox" value="${l}" id="lv-${l}" checked><label class="form-check-label" for="lv-${l}">${l} hPa</label></div>`;
                });
            }
            document.getElementById('btn-crop').disabled = false;
        } catch (e) {
            alert("Erreur de liaison serveur : " + e);
        } finally {
            btn.disabled = false; btn.innerText = "🔍 Scan automatique du fichier distant";
        }
    }

    // VOTRE FONCTION EXTRACTION REPRISE AVEC LA TRANSMISSION DE LA CASE A COCHER
    async function fetchAndCropGrib() {
        const steps = Array.from(document.querySelectorAll('.chk-step:checked')).map(el => el.value);
        const params = Array.from(document.querySelectorAll('.chk-p:checked')).map(el => el.value);
        const levels = Array.from(document.querySelectorAll('.chk-l:checked')).map(el => el.value);
        const useFallback = document.getElementById('useFallbackRun').checked; // LECTURE DE LA CASE

        document.getElementById('progress-container').classList.remove('d-none');
        const pBar = document.getElementById('progress-bar');
        pBar.style.width = "10%"; pBar.innerText = "Téléchargement...";

        const track = setInterval(async () => {
            const resp = await fetch('/api/progress');
            const d = await resp.json();
            pBar.style.width = d.progress + "%"; pBar.innerText = `Découpe : ${d.progress}%`;
        }, 1000);

        try {
            const resp = await fetch('/api/fetch_and_crop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bounds: currentBounds, params: params, levels: levels, steps: steps, levtype: currentLevType, use_fallback: useFallback // ENVOI FLUX DE SECOURS
                })
            });
            clearInterval(track);
            const res = await resp.json();

            if (res.error) { alert(res.error); pBar.innerText = "Échec"; return; }
            
            pBar.style.width = "100%"; pBar.innerText = "✓ Terminé !";
            window.location.href = res.download_url;
        } catch (e) {
            clearInterval(track);
            alert("Erreur réseau : " + e);
        }
    }
</script>
</body>
</html>
