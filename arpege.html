    <script>
        const canvas = document.getElementById('grid-canvas'); const ctx = canvas.getContext('2d');
        const mapCanvas = document.getElementById('map-background'); const mctx = mapCanvas.getContext('2d');
        const box = document.getElementById('selection-box'); const display = document.getElementById('coords-display');

        let isDrawing = false; let startX, startY, endX, endY; window.currentBounds = null;

        function pixelToCoords(x, y) {
            let lon = ((x / canvas.width) * 360) - 180;
            let lat = 90 - ((y / canvas.height) * 180);
            return { lat: parseFloat(lat.toFixed(2)), lon: parseFloat(lon.toFixed(2)) };
        }
        function toX(lon) { return ((lon + 180) / 360) * mapCanvas.width; }
        function toY(lat) { return ((90 - lat) / 180) * mapCanvas.height; }

        function resizeCanvas() {
            canvas.width = window.innerWidth - 420; canvas.height = window.innerHeight;
            mapCanvas.width = window.innerWidth - 420; mapCanvas.height = window.innerHeight;
            drawWorldMap(); drawBackgroundGrid();
        }

        function drawShape(poly) {
            if (!poly || poly.length < 2) return;
            try {
                mctx.beginPath(); mctx.moveTo(toX(poly), toY(poly));
                for (let i = 1; i < poly.length; i++) mctx.lineTo(toX(poly[i]), toY(poly[i]));
                mctx.closePath(); mctx.fill(); mctx.stroke();
            } catch(e) {}
        }

        function drawWorldMap() {
            mctx.fillStyle = '#0b0f19'; mctx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
            mctx.fillStyle = '#1e293b'; mctx.strokeStyle = '#451a03'; mctx.lineWidth = 1.2;
            // Tracé centré sur l'Europe (Bretagne, France et Méditerranée magnifiées)
            drawShape([[-5.1,48.4],[-4.7,48.5],[-3.0,48.6],[-1.5,49.3],[-1.7,49.6],[-0.5,49.3],[1.3,50.1],[2.5,51.1],[4.5,51.4],[6.1,53.5],[8.5,54.5],[10.9,55.9],[14.2,54.2],[12.2,52.8],[6.1,51.1],[3.2,43.5],[4.8,43.3],[7.2,43.7],[9.2,44.2],[12.3,44.3],[13.6,45.7],[12.2,41.9],[15.0,38.2],[12.3,37.3],[14.1,40.7],[10.5,43.8],[7.4,43.4],[5.2,43.1],[3.1,41.9],[-1.4,43.4],[-1.2,44.6],[-2.2,47.2],[-5.1,48.4]]);
            drawShape([[-1.4,43.4],[-3.7,43.4],[-9.0,43.0],[-9.5,42.3],[-8.9,38.5],[-9.3,37.0],[-5.3,36.1],[-1.0,36.8],[2.3,41.5],[3.1,41.9]]);
            drawShape([[-5.0,50.1],[-6.0,50.5],[-5.3,52.1],[-4.9,54.1],[-6.4,56.5],[-7.2,58.3],[-4.1,57.6],[-1.9,57.1],[-1.8,55.5],[1.3,51.3],[-1.1,50.6],[-5.0,50.1]]);
            drawShape([[8.7,42.6],[9.5,42.6],[9.4,41.4],[8.7,41.6]]); drawShape([[8.4,41.2],[9.7,40.9],[9.6,39.2],[8.4,38.9],[7.9,40.2]]);
            drawShape([[-5.3,36.1],[5.0,36.8],[11.0,36.9],[15.0,32.3],[25.0,31.6],[34.0,29.6],[39.0,-4.0],[-14.5,14.5],[-13.1,32.3],[-5.3,36.1]]);
        }

        function drawBackgroundGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.08)'; ctx.lineWidth = 0.5;
            ctx.fillStyle = 'rgba(244, 63, 94, 0.4)'; ctx.font = '10px monospace';
            for(let lon=-30; lon<=40; lon+=10) {
                let x = toX(lon); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                ctx.fillText(lon + '°', x + 4, canvas.height - 10);
            }
            for(let lat=20; lat<=70; lat+=10) {
                let y = toY(lat); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillText(lat + '°N', 10, y - 4);
            }
        }

        function drawSelectionBox() {
            drawBackgroundGrid(); if (!isDrawing) return;
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(244, 63, 94, 0.12)';
            let x = Math.min(startX, endX); let y = Math.min(startY, endY);
            let w = Math.abs(startX - endX); let h = Math.abs(startY - endY);
            ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
        }

        window.addEventListener('resize', resizeCanvas); setTimeout(resizeCanvas, 100);

        canvas.addEventListener('mousedown', function(e) {
            if (!e.shiftKey) return; isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left; startY = e.clientY - rect.top; endX = startX; endY = startY;
        });
        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            endX = e.clientX - rect.left; endY = e.clientY - rect.top;
            drawSelectionBox();
            let sC = pixelToCoords(startX, startY); let eC = pixelToCoords(endX, endY);
            window.currentBounds = { n: Math.max(sC.lat, eC.lat), s: Math.min(sC.lat, eC.lat), e: Math.max(sC.lon, eC.lon), w: Math.min(sC.lon, eC.lon) };
            display.innerHTML = `<b>N:</b> ${window.currentBounds.n}° | <b>S:</b> ${window.currentBounds.s}°<br><b>E:</b> ${window.currentBounds.e}° | <b>W:</b> ${window.currentBounds.w}°`;
            checkReady();
        });
        canvas.addEventListener('mouseup', function() { if (isDrawing) isDrawing = false; });

        document.getElementById('btn-load-fav').onclick = function() {
            const val = document.getElementById('fav-select').value; if(!val) return;
            window.currentBounds = JSON.parse(val);
            display.innerHTML = `<b>N:</b> ${window.currentBounds.n}° | <b>S:</b> ${window.currentBounds.s}°<br><b>E:</b> ${window.currentBounds.e}° | <b>W:</b> ${window.currentBounds.w}°`;
            startX = toX(window.currentBounds.w); startY = toY(window.currentBounds.n);
            endX = toX(window.currentBounds.e); endY = toY(window.currentBounds.s);
            isDrawing = true; drawSelectionBox(); isDrawing = false; checkReady();
        };

        document.getElementById('btn-scan').onclick = function() {
            const checkedBoxes = document.querySelectorAll('#step-container input[type="checkbox"]:checked');
            const selectedSteps = Array.from(checkedBoxes).map(cb => cb.value);
            if(selectedSteps.length === 0) { alert("⚠️ Cochez au moins une échéance."); return; }
            
            document.getElementById('status').innerText = "⏳ Scan Météo-France en cours...";
            document.getElementById('btn-scan').disabled = true;

            fetch('/api/scan_arpege', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steps: selectedSteps })
            })
            .then(res => res.json()).then(data => {
                document.getElementById('btn-scan').disabled = false;
                if(data.error) { document.getElementById('status').innerText = "❌ " + data.error; }
                else {
                    document.getElementById('status').innerText = "✅ Scan ARPEGE réussi !";
                    const pList = document.getElementById('param-list'); pList.innerHTML = "";
                    data.params.forEach(p => { let o = document.createElement('option'); o.value = p; o.innerText = p; pList.appendChild(o); });
                    const lList = document.getElementById('level-list'); lList.innerHTML = "";
                    data.levels.forEach(l => { let o = document.createElement('option'); o.value = l; o.innerText = l; lList.appendChild(o); });
                    checkReady();
                }
            }).catch(() => { document.getElementById('status').innerText = "❌ Erreur réseau."; document.getElementById('btn-scan').disabled = false; });
        };

        function checkReady() {
            const pSelect = document.getElementById('param-list');
            if (window.currentBounds && pSelect.options.length > 0 && pSelect.value !== "") {
                document.getElementById('btn-crop').disabled = false;
            }
        }
        document.getElementById('param-list').onchange = checkReady;
        document.getElementById('level-list').onchange = checkReady;

        document.getElementById('btn-crop').onclick = function() {
            const selectedParams = Array.from(document.getElementById('param-list').selectedOptions).map(opt => opt.value);
            const selectedLevels = Array.from(document.getElementById('level-list').selectedOptions).map(opt => opt.value);
            const checkedBoxes = document.querySelectorAll('#step-container input[type="checkbox"]:checked');
            const selectedSteps = Array.from(checkedBoxes).map(cb => cb.value);

            document.getElementById('progress-container').style.display = 'flex';
            document.getElementById('btn-crop').disabled = true;
            
            let progressInterval = setInterval(function() {
                fetch('/api/progress').then(res => res.json()).then(data => {
                    document.getElementById('progress-bar').value = data.progress;
                    document.getElementById('progress-text').innerText = "Découpe ARPEGE en cours : " + data.progress + "%";
                });
            }, 500);

            fetch('/api/fetch_and_crop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bounds: window.currentBounds, params: selectedParams, levels: selectedLevels, steps: selectedSteps })
            })
            .then(res => res.json()).then(data => {
                clearInterval(progressInterval); document.getElementById('progress-container').style.display = 'none'; document.getElementById('btn-crop').disabled = false;
                if (data.success) { window.location.href = data.download_url; } else { alert("❌ " + data.error); }
            });
        };
    </script>
</body>
</html>
